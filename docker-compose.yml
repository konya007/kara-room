services:
  kararoom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kararoom
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Cấu hình STUN/TURN tùy chọn (mặc định dùng STUN công khai của Google):
      # - NEXT_PUBLIC_ICE_SERVERS='[{"urls":"stun:stun.l.google.com:19302"}]'
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - kararoom_data:/app/.data

volumes:
  kararoom_data:
    driver: local
