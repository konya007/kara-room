services:
  kararoom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kararoom
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${SERVICE_FQDN_KARAROOM:-}
    volumes:
      - kararoom_data:/app/.data

volumes:
  kararoom_data:
    driver: local

